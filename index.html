<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For you mom</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand">
        <img src="assets/logo.png" alt="Mom music logo" class="logo-image" />
        <div>
          <h1>For you mom</h1>
          <p>love you amma hear and enjoy.</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Search songs..." aria-label="Search songs" />
        </div>
        <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="main-grid">
      <section class="player-panel">
        <div class="player-card">
          <div class="player-info">
            <div class="track-art">M</div>
            <div>
              <p class="label">Now playing</p>
              <h2 id="currentTitle">Select a song to play</h2>
              <p id="currentTrackInfo" class="track-info">Choose a song from the playlist.</p>
            </div>
          </div>
          <div class="audio-player">
            <audio id="audioPlayer" preload="metadata"></audio>
            <div class="progress-row">
              <span id="currentTime">00:00</span>
              <input id="progressBar" type="range" min="0" value="0" step="1" />
              <span id="duration">00:00</span>
            </div>
            <div class="volume-control">
              <span class="volume-icon">🔊</span>
              <div class="volume-slider-container">
                <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="70" aria-label="Volume control" />
                <span id="volumePercent" class="volume-percent">70%</span>
              </div>
            </div>
          </div>
          <div class="player-controls">
            <button id="shuffleBtn" class="btn secondary" type="button" aria-label="Shuffle">🔀</button>
            <button id="prevBtn" class="btn secondary" type="button" disabled>⏮️</button>
            <button id="playPauseBtn" class="btn" disabled>▶️</button>
            <button id="nextBtn" class="btn secondary" type="button" disabled>⏭️</button>
            <button id="loopBtn" class="btn secondary" type="button" aria-label="Loop">🔁</button>
          </div>
        </div>
      </section>

      <section class="playlist-panel">
        <h2>Playlist</h2>
        <div id="playlist" class="playlist"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
